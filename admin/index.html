<body>

<!-- ÉCRAN DE CONNEXION -->
<div id="loginScreen" class="login-wrap" hidden>
  <div class="login-card">
    <div class="login-mark"><img src="../images/logo.png" alt="" width="72" height="72"></div>
    <h1>Hadeej’Art</h1>
    <p class="sub">Espace administrateur</p>
    <div id="loginError" class="error-box" hidden></div>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Mot de passe</label>
        <div class="pw-wrap"><input id="loginPassword" type="password" required autocomplete="current-password"><button type="button" class="pw-eye" id="pwEye" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </div>
      <button id="loginBtn" class="btn block" type="submit">Se connecter</button>
    </form>
  </div>
</div>

<!-- APPLICATION ADMIN -->
<div id="adminApp" class="app-shell" hidden>
  <header class="topbar">
    <div class="topbar-brand"><span class="logo-mark" aria-hidden="true">H’A</span><span class="topbar-name">Hadeej’Art <em>Admin</em></span></div>
    <div class="topbar-right">
      <a class="site-link" href="../index.html" target="_blank" rel="noopener">Voir le site ↗</a>
      <span id="whoami" class="who"></span>
    </div>
  </header>

  <main class="main">
    <section id="section-dashboard" class="section"></section>
    <section id="section-orders" class="section hidden"></section>
    <section id="section-products" class="section hidden"></section>
    <section id="section-categories" class="section hidden"></section>
    <section id="section-collections" class="section hidden"></section>
    <section id="section-customers" class="section hidden"></section>
    <section id="section-newsletter" class="section hidden"></section>
    <section id="section-settings" class="section hidden"></section>
  </main>

  <nav class="dock" id="dock" aria-label="Navigation principale">
    <div class="dock-scrim" id="dockScrim"></div>
    <div class="dock-bar">
      <button class="nav-item dock-item active" data-section="dashboard" title="Accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg><span class="dock-label">Accueil</span></button>
      <button class="nav-item dock-item" data-section="orders" title="Commandes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12l2 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"/><path d="M4 7h16"/><path d="M9 11a3 3 0 0 0 6 0"/></svg><span class="dock-label">Commandes</span><span class="dock-badge" id="badgeOrders" hidden aria-label="commandes à confirmer"></span></button>
      <button class="nav-item dock-item" data-section="products" title="Produits"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 3 6l2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z"/></svg><span class="dock-label">Produits</span></button>
      <div class="dock-more-group" id="dockMore">
      <button class="nav-item dock-item" data-section="categories" title="Catégories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg><span class="dock-label">Catégories</span></button>
      <button class="nav-item dock-item" data-section="collections" title="Collections"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg><span class="dock-label">Collections</span></button>
      <button class="nav-item dock-item" data-section="customers" title="Clients"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6.5 6.5 0 0 1 3.5 6"/></svg><span class="dock-label">Clients</span></button>
      <button class="nav-item dock-item" data-section="newsletter" title="Carnet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg><span class="dock-label">Carnet</span></button>
      <button class="nav-item dock-item" data-section="settings" title="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg><span class="dock-label">Réglages</span></button>
        <button type="button" id="logoutBtn" class="dock-item dock-logout" title="Déconnexion"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="m16 8 4 4-4 4M20 12H9"/></svg><span class="dock-label">Sortir</span></button>
      </div>
      <button type="button" id="dockMoreBtn" class="dock-item dock-more-btn" aria-expanded="false" aria-controls="dockMore" title="Plus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span class="dock-label">Plus</span></button>
    </div>
  </nav>
