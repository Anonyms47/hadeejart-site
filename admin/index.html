<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hadeej’Art — Administration</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ÉCRAN DE CONNEXION -->
<div id="loginScreen" class="login-wrap" hidden>
  <div class="login-card">
    <h1>Hadeej’Art</h1>
    <p class="sub">Espace administrateur</p>
    <div id="loginError" class="error-box" hidden></div>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Mot de passe</label>
        <input id="loginPassword" type="password" required autocomplete="current-password">
      </div>
      <button id="loginBtn" class="btn block" type="submit">Se connecter</button>
    </form>
  </div>
</div>

<!-- APPLICATION ADMIN -->
<div id="adminApp" class="app-shell" hidden>
  <aside class="sidebar">
    <div class="brand">Hadeej’Art Admin</div>
    <button class="nav-item active" data-section="dashboard">📊 Dashboard</button>
    <button class="nav-item" data-section="products">🧺 Produits</button>
    <button class="nav-item" data-section="categories">🏷️ Catégories</button>
    <button class="nav-item" data-section="collections">📁 Collections</button>
    <button class="nav-item" data-section="orders">🧾 Commandes</button>
    <button class="nav-item" data-section="customers">👥 Clients</button>
    <button class="nav-item" data-section="settings">⚙️ Paramètres</button>
    <div class="sidebar-footer">
      <span id="whoami"></span>
      <button id="logoutBtn" class="btn ghost sm block">Déconnexion</button>
    </div>
  </aside>

  <main class="main">
    <section id="section-dashboard" class="section"></section>
    <section id="section-products" class="section hidden"></section>
    <section id="section-categories" class="section hidden"></section>
    <section id="section-collections" class="section hidden"></section>
    <section id="section-orders" class="section hidden"></section>
    <section id="section-customers" class="section hidden"></section>
    <section id="section-settings" class="section hidden"></section>
  </main>
</div>

<div id="toastHost"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/categories.js"></script>
<script src="js/collections.js"></script>
<script src="js/products.js"></script>
<script src="js/orders.js"></script>
<script src="js/customers.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
