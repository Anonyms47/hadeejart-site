<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow">
<title>Hadeej’Art — Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800&family=Fraunces:opsz,wght@9..144,500..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ÉCRAN DE CONNEXION -->
<div id="loginScreen" class="login-wrap" hidden>
  <div class="login-card">
    <h1>Hadeej’Art</h1>
    <p class="sub">Espace administrateur</p>
    <div id="loginError" class="error-box" hidden></div>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Mot de passe</label>
        <input id="loginPassword" type="password" required autocomplete="current-password">
      </div>
      <button id="loginBtn" class="btn block" type="submit">Se connecter</button>
    </form>
  </div>
</div>

<!-- APPLICATION ADMIN -->
<div id="adminApp" class="app-shell" hidden>
  <aside class="sidebar" id="adminSidebar">
    <div class="sidebar-top">
      <div class="brand"><span class="brand-full">Hadeej’Art Admin</span><span class="brand-mini" aria-hidden="true">H’A</span></div>
      <button type="button" id="sidebarToggle" class="sidebar-toggle" aria-expanded="true" aria-controls="adminSidebar" aria-label="Réduire le menu" title="Réduire le menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <button class="nav-item active" data-section="dashboard" title="Dashboard"><span class="nav-ico" aria-hidden="true">📊</span><span class="nav-label">Dashboard</span></button>
    <button class="nav-item" data-section="products" title="Produits"><span class="nav-ico" aria-hidden="true">🧺</span><span class="nav-label">Produits</span></button>
    <button class="nav-item" data-section="categories" title="Catégories"><span class="nav-ico" aria-hidden="true">🏷️</span><span class="nav-label">Catégories</span></button>
    <button class="nav-item" data-section="collections" title="Collections"><span class="nav-ico" aria-hidden="true">📁</span><span class="nav-label">Collections</span></button>
    <button class="nav-item" data-section="orders" title="Commandes"><span class="nav-ico" aria-hidden="true">🧾</span><span class="nav-label">Commandes</span></button>
    <button class="nav-item" data-section="customers" title="Clients"><span class="nav-ico" aria-hidden="true">👥</span><span class="nav-label">Clients</span></button>
    <button class="nav-item" data-section="settings" title="Paramètres"><span class="nav-ico" aria-hidden="true">⚙️</span><span class="nav-label">Paramètres</span></button>
    <div class="sidebar-footer">
      <span id="whoami"></span>
      <button id="logoutBtn" class="btn ghost sm block" title="Déconnexion"><span class="nav-ico" aria-hidden="true">⎋</span><span class="nav-label">Déconnexion</span></button>
    </div>
  </aside>

  <main class="main">
    <section id="section-dashboard" class="section"></section>
    <section id="section-products" class="section hidden"></section>
    <section id="section-categories" class="section hidden"></section>
    <section id="section-collections" class="section hidden"></section>
    <section id="section-orders" class="section hidden"></section>
    <section id="section-customers" class="section hidden"></section>
    <section id="section-settings" class="section hidden"></section>
  </main>
</div>

<div id="toastHost"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/util.js"></script>
<script src="js/translate.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/categories.js"></script>
<script src="js/collections.js"></script>
<script src="js/products.js"></script>
<script src="js/orders.js"></script>
<script src="js/customers.js"></script>
<script src="js/settings.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
